<!doctype html>
<html lang="ko">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Team | PRISM Lab</title>
  <link rel="stylesheet" href="styles.css">
  <script src="data/content.js"></script>
  <script defer src="script.js"></script>
</head>

<body data-page="people">
  <main>
    <section class="page-top">
      <div class="page-banner team-page-banner">
        <div class="eyebrow">Our Team</div>
        <h1>Different expertise.<br>One shared question.</h1>
      </div>
    </section>

    <section class="content-wrap team-content">
      <div class="section-label">Principal Investigator</div>
      <div class="people-main" id="pi"></div>

      <section class="cv-section">
        <div class="cv-section-heading">
          <h2>Biography</h2>
        </div>
        <div id="pi-biography" class="cv-biography"></div>
      </section>

      <section class="cv-section">
        <div class="cv-section-heading">
          <h2>Research Interests</h2>
        </div>
        <div class="interest-grid" id="pi-interests"></div>
      </section>

      <section class="cv-section">
        <div class="cv-section-heading">
          <h2>Education & Academic Appointments</h2>
        </div>
        <div class="timeline" id="pi-career"></div>
      </section>

      <section class="cv-section">
        <div class="cv-section-heading cv-heading-with-action">
          <h2>Publications</h2>
          <a class="scholar-link" href="https://scholar.google.com/citations?hl=en&user=ygvc5bEAAAAJ" target="_blank"
            rel="noopener">
            Google Scholar ↗
          </a>
        </div>
        <h3 class="publication-subheading">Selected Papers</h3>

        <div class="selected-publications" id="pi-selected-publications"></div>
      </section>

      <section class="cv-section">
        <div class="cv-section-heading">
          <h2>Awards, Honors & Research Funding</h2>
        </div>
        <div class="achievement-list" id="pi-achievements"></div>
      </section>
    </section>
  </main>
</body>

</html>
